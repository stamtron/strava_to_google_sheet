[project]
name = "strava-to-google-sheet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
    "garminconnect>=0.3.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "google-genai>=2.20.0",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is imported as `src.*` from the repo root, which isn't installed.
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true
