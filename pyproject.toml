[project]
name = "staminai"
version = "0.2.0"
description = "StaminAI — Adaptive Multi-Sport Endurance Training & Recovery Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.1",
    "google-auth-oauthlib>=1.1.0",
    "garminconnect>=0.3.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "google-genai>=2.20.0",
    "chromadb>=1.5.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is imported as `src.*` from the repo root, which isn't installed.
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]
# E501: long Greek message strings and Sheets formulas exceed any sane line limit.
# E402: several modules deliberately import after logger setup / circular-import guards.
# B905: zip(strict=True) would turn tolerated length mismatches into crashes.
ignore = ["E501", "E402", "B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() in defaults is the framework idiom.
"src/api/server.py" = ["B008"]
"tests/**" = ["DTZ"]
